[pytest]
testpaths = tests
addopts =
    --base-url=https://demoqa.com
    --browser=chromium
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=test-results
    --html=reports/report.html
    --self-contained-html
markers =
    ui: browser UI tests
    api: Book Store REST API tests
    smoke: quick critical-path checks
